name: Deploy to Production Server

on:
  push:
    branches:
      - main # change to master if your default branch is master

jobs:
  deploy:
    name: Deploy to VPS Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on Server..."

            # 1. Navigate to Project Directory
            cd ${{ secrets.SERVER_APP_DIR || '/var/www/kalyan-nagar' }}

            # 2. Pull Latest Changes from GitHub
            echo "📥 Pulling latest git changes..."
            git fetch origin
            git reset --hard origin/main

            # 3. Setup / Update Django Backend
            echo "🐍 Updating Django Backend..."
            cd backend/trainer_dashboard_django

            # Find and activate virtualenv if available
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d "../venv" ]; then
              source ../venv/bin/activate
            elif [ -d "../../venv" ]; then
              source ../../venv/bin/activate
            elif [ -d "env" ]; then
              source env/bin/activate
            elif [ -d "../env" ]; then
              source ../env/bin/activate
            elif [ -d "../../env" ]; then
              source ../../env/bin/activate
            fi

            # Determine python & pip binary
            PYTHON_BIN=$(command -v python3 || command -v python)
            PIP_BIN=$(command -v pip3 || command -v pip || echo "$PYTHON_BIN -m pip")

            echo "Using Python: $PYTHON_BIN"
            $PIP_BIN install -r requirements.txt --quiet || true
            $PYTHON_BIN manage.py migrate --noinput
            $PYTHON_BIN manage.py collectstatic --noinput || true

            cd ../..

            # 4. Setup / Build React Frontend
            echo "⚛️ Building Frontend..."
            cd frontend/learnmore-moniter
            npm install --legacy-peer-deps --quiet
            npm run build
            cd ../..

            # 5. Setup WhatsApp Baileys Bot (server-side)
            echo "📱 Setting up WhatsApp Baileys Bot..."
            cd frontend/learnmore-moniter/whatsapp-bot
            npm install --quiet || true
            cd ../../..

            # 6. Restart Services (Gunicorn / Nginx / PM2 / Systemd)
            echo "🔄 Restarting Services..."
            if systemctl is-active --quiet gunicorn; then
              sudo systemctl restart gunicorn || true
            fi

            # Ensure WhatsApp bot runs via PM2
            if command -v pm2 &> /dev/null; then
              # Restart Django/frontend if managed by pm2
              pm2 restart all --silent 2>/dev/null || true
              # Start WhatsApp bot if not already running
              pm2 describe whatsapp-bot > /dev/null 2>&1 || \
                pm2 start frontend/learnmore-moniter/whatsapp-bot/server.js \
                  --name whatsapp-bot \
                  --restart-delay=3000 \
                  --max-restarts=10 || true
              pm2 save --force || true
            fi

            if systemctl is-active --quiet nginx; then
              sudo systemctl reload nginx || true
            fi

            echo "✅ Deployment Completed Successfully!"
